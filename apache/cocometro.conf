# cocometro (Cocômetro)
<VirtualHost *:8081>
        ServerName cocometro.localhost
        ServerAlias cronometro.localhost
        DocumentRoot /var/www/cronometro/
        DirectoryIndex index.php index.html
        <Directory "/var/www/cronometro/">
                Options -Indexes +FollowSymLinks
                AllowOverride All
                Require all granted
        </Directory>
</VirtualHost>
